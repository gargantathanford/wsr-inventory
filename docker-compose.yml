# Usage:
#   1. cp .env.example .env, then set a real SESSION_SECRET
#      (openssl rand -base64 48) — do NOT ship the placeholder value.
#   2. First run only — initialize the production database (real subsystems,
#      one real admin account, no demo data). This runs once via the `seed`
#      service below, which uses the `builder` stage (has devDependencies,
#      including tsx) rather than the slim runtime image:
#        ADMIN_EMAIL=you@warpspeedracing.org ADMIN_NAME="Your Name" \
#          docker compose run --rm seed
#      Copy the printed password immediately — it's shown once.
#   3. docker compose up -d app
#   4. curl http://localhost:3000/api/health
#
# This file runs the app only — TLS termination is still handled by Caddy or
# nginx on the host in front of this container (see deploy/Caddyfile,
# deploy/nginx.conf), same as the non-Docker deployment path in DEPLOYMENT.md.

# Pinned deliberately. Without this, Compose derives the project name from the
# DIRECTORY the file sits in, and prefixes volume names with it — so `wsr-data`
# becomes `wsr-inventory_wsr-data` here but `repo_wsr-data` on a CI runner that
# checks out into a differently named folder. The result is a brand new empty
# volume with no error: the app starts, /api/health used to report ok, and the
# database is gone. Pinning the name makes the volume `wsr_wsr-data` on every
# machine regardless of folder name.
#
# If you have ALREADY run this stack without a pinned name, your data is in the
# old volume. Move it before relying on this:
#   docker volume create wsr_wsr-data
#   docker run --rm -v wsr-inventory_wsr-data:/from -v wsr_wsr-data:/to alpine \
#     sh -c "cd /from && cp -a . /to"
# Check what exists first with `docker volume ls | grep wsr-data`.
name: wsr

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Stamped into the image and reported by /api/health, so "am I running
        # the code I just pulled?" is a curl rather than a guess. Optional —
        # the build time is recorded either way. Pass it with:
        #   BUILD_REF=$(git rev-parse --short HEAD) docker compose up -d --build app
        BUILD_REF: ${BUILD_REF:-unknown}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in .env — see .env.example}
      PORT: 3000
    volumes:
      - wsr-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-off: `docker compose run --rm seed`. Not part of `up` — this only runs
  # when invoked explicitly, and initializing an already-populated database is
  # a safe no-op (scripts/seed-production.ts refuses if users already exist).
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    working_dir: /app
    # Runs via docker-entrypoint.sh: starts root, fixes volume ownership, then
    # drops to uid 1001 before running the seed. This is what makes the same
    # config work on both Docker Desktop (Mac) and a Linux host.
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["npx", "tsx", "scripts/seed-production.ts"]
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - wsr-data:/app/data

  # One-off: `docker compose run --rm backup`. Online backup of wsr-data (SQLite
  # backup API — safe while `app` is running) into ./backups on the host. The
  # entrypoint chowns /app/backups to 1001 and drops privileges, so backup files
  # are owned by uid 1001. `profiles` keeps this out of a bare `docker compose up`.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh", "npx", "tsx", "scripts/backup.ts"]
    command: []
    environment:
      BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-14}
    volumes:
      - wsr-data:/app/data
      - ./backups:/app/backups
      - ./scripts:/app/scripts:ro
      - ./lib:/app/lib:ro

  # One-off, app STOPPED: `docker compose stop app` first, then
  #   docker compose run --rm restore              # lists timestamps
  #   docker compose run --rm restore <timestamp>
  # A trailing argument replaces `command` and is appended to the entrypoint, so
  # the timestamp lands as the script's argv[2].
  restore:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh", "npx", "tsx", "scripts/restore.ts"]
    command: ["--list"]
    volumes:
      - wsr-data:/app/data
      - ./backups:/app/backups
      - ./scripts:/app/scripts:ro
      - ./lib:/app/lib:ro

  # One-off maintenance shell with devDependencies available (tsx), sharing the
  # app's data volume and the host ./backups folder.
  maint:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    profiles: ["tools"]
    working_dir: /app
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["sh"]
    volumes:
      - wsr-data:/app/data
      - ./backups:/app/backups
      # scripts/ and lib/ are bind-mounted READ-ONLY from the working tree.
      #
      # Without this, every maintenance command runs the copy baked into the
      # image, so a `git pull` that adds or changes a script does nothing until
      # somebody remembers `docker compose build maint`. That has now bitten
      # twice, both times with the same unhelpful error:
      #   Error [ERR_MODULE_NOT_FOUND]: Cannot find module '/app/scripts/x.ts'
      # which reads as a broken script rather than a stale image.
      #
      # lib/ comes too because scripts import from it (password hashing, the XP
      # store) and read lib/schema.sql at runtime — a half-updated pair is worse
      # than neither. Read-only: these containers must never write back into the
      # repo.
      - ./scripts:/app/scripts:ro
      - ./lib:/app/lib:ro


volumes:
  wsr-data:
