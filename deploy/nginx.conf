# nginx alternative to deploy/Caddyfile — use this if the hosting provider's
# stack is nginx-based rather than Caddy. Unlike Caddy, nginx does NOT obtain
# TLS certificates automatically; run certbot first (see below) and this
# config assumes certificates already exist at the paths referenced.
#
# Setup:
#   1. Point DNS for the subdomain at this server (done wherever
#      warpspeedracing.com is managed, not here).
#   2. sudo apt install certbot python3-certbot-nginx
#   3. sudo certbot --nginx -d dashboard.warpspeedracing.com
#      (certbot will offer to write/modify a config like this one for you,
#      and sets up auto-renewal via a systemd timer — that's the easiest path;
#      this file is provided for reference/manual setup instead.)
#   4. Replace the placeholder hostname below, copy to
#      /etc/nginx/sites-available/wsr-inventory, symlink into
#      sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.

server {
    listen 80;
    server_name dashboard.warpspeedracing.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.warpspeedracing.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.warpspeedracing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.warpspeedracing.com/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # This app never uses next/image, but the endpoint exists in every
    # Next.js server by default. Block it as a second layer on top of
    # `images: { unoptimized: true }` in next.config.mjs — closes the
    # Image Optimization API advisories in `npm audit` without needing a
    # major Next.js version migration to reach a fully-patched release.
    location /_next/image {
        return 404;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Required — the app's login rate limiter and audit log read this
        # header to identify the real client IP behind the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/wsr-inventory-access.log;
}
